name: go
adopt-info: go
build-base: ubuntu@26.04
title: Go SDK
summary: The Go programming language
description: |
  This SDK provides the official Go toolchain for efficient Go
  development. Module downloads are persisted on the host to speed up builds
  across workshop updates, and Go environment settings are preserved between
  workshop updates.

  ## Key components

  - `go`: The Go programming language toolchain, including the
    compiler, standard library, and all official tools (`gofmt`, `goimports`,
    etc.). The version is determined by the SDK release, not the base image.
  - Module cache: Configured to persist at `~/go/pkg/mod` with a bind mount
    to the host, so downloaded dependencies survive workshop updates.
  - Environment preservation: Custom Go environment variables (set via
    `go env -w`) are automatically saved and restored across workshop updates.

  The SDK installs the complete official Go distribution from go.dev. Build tools
  such as `gcc` are **not** included. If your project requires CGo or needs to
  compile C dependencies, install the necessary toolchain separately.

  ## Setup actions

  On launch, the SDK:

  - Adds Go binaries to `PATH` system-wide via `/etc/profile.d/go.sh`.
  - Configures `GOMODCACHE` to point to the persistent mount at
    `~/go/pkg/mod`.
  - Restores any previously changed Go environment variables.
license: BSD-3-Clause
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [amd64]
    build-for: [arm64]
  riscv64:
    build-on: [amd64]
    build-for: [riscv64]

plugs:
  mod-cache:
    interface: mount
    workshop-target: /home/workshop/go/pkg/mod

parts:
  go:
    plugin: nil
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
      curl -fLO "https://go.dev/dl/go${VERSION}.linux-${CRAFT_ARCH_BUILD_FOR}.tar.gz"
      mkdir -p "$CRAFT_PART_INSTALL"
      tar -xzf "go${VERSION}.linux-${CRAFT_ARCH_BUILD_FOR}.tar.gz" --strip-components=1 -C "$CRAFT_PART_INSTALL"
