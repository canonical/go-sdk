name: Build SDK

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on:
      - self-hosted
      - linux
      - jammy
      - x64
      - xlarge
    steps:
      - uses: actions/checkout@v4

      - name: Install sdkcraft
        run: sudo snap install sdkcraft --edge --classic

      - name: Pack SDK
        run: sdkcraft pack
