summary: Compile, test, and run a multi-package Go program with an external dependency

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # A "slightly complex" Go program that exercises the toolchain:
  #   * external module (github.com/google/uuid) → hits GOMODCACHE
  #   * sub-package import → exercises module path resolution
  #   * goroutines + channels + sync → exercises the runtime
  #   * unit test → exercises `go test`
  #   * built binary → exercises `go build` + linker
  #
  # Each source file is streamed into the workshop via stdin so no
  # in-workshop shell is needed for redirects or heredocs.

  workshop exec -- mkdir -p /home/workshop/app/parallel

  workshop exec -- tee /home/workshop/app/go.mod >/dev/null <<'MOD'
  module example.com/spread-app

  go 1.21

  require github.com/google/uuid v1.6.0
  MOD

  workshop exec -- tee /home/workshop/app/main.go >/dev/null <<'MAIN'
  package main

  import (
  	\"fmt\"
  	\"os\"

  	\"example.com/spread-app/parallel\"
  )

  func main() {
  	const workers = 8
  	const total = 16
  	ids := parallel.GenerateIDs(workers, total)
  	if len(ids) != total {
  		fmt.Fprintf(os.Stderr, \"expected %d ids, got %d\n\", total, len(ids))
  		os.Exit(1)
  	}
  	for _, id := range ids {
  		fmt.Println(id)
  	}
  }
  MAIN

  workshop exec -- tee /home/workshop/app/parallel/parallel.go >/dev/null <<'PKG'
  package parallel

  import (
  	\"sync\"

  	\"github.com/google/uuid\"
  )

  func GenerateIDs(workers, n int) []string {
  	results := make([]string, n)
  	jobs := make(chan int, n)
  	var wg sync.WaitGroup

  	for w := 0; w < workers; w++ {
  		wg.Add(1)
  		go func() {
  			defer wg.Done()
  			for i := range jobs {
  				results[i] = uuid.NewString()
  			}
  		}()
  	}

  	for i := 0; i < n; i++ {
  		jobs <- i
  	}
  	close(jobs)
  	wg.Wait()

  	return results
  }
  PKG

  workshop exec -- tee /home/workshop/app/parallel/parallel_test.go >/dev/null <<'TEST'
  package parallel

  import \"testing\"

  func TestGenerateIDsAreUnique(t *testing.T) {
  	const workers = 4
  	const n = 32
  	ids := GenerateIDs(workers, n)
  	if len(ids) != n {
  		t.Fatalf(\"expected %d ids, got %d\", n, len(ids))
  	}
  	seen := make(map[string]struct{}, n)
  	for _, id := range ids {
  		if id == \"\" {
  			t.Fatal(\"got empty id\")
  		}
  		if _, dup := seen[id]; dup {
  			t.Fatalf(\"duplicate id: %q\", id)
  		}
  		seen[id] = struct{}{}
  	}
  }
  TEST

  # Resolve the dependency: populates GOMODCACHE and writes go.sum.
  workshop exec -w /home/workshop/app -- go mod tidy

  # Sanity-check that the external module landed in the cache plug, not
  # somewhere on a default tmpfs path.
  workshop exec -- ls /home/workshop/go/pkg/mod/cache/download/github.com/google/uuid/@v/ \
    | MATCH "v1\.6\.0\.zip"

  # Run the test suite — must pass.
  workshop exec -w /home/workshop/app -- go test ./... | MATCH "ok\s+example.com/spread-app/parallel"

  # Build the binary into /tmp (avoid polluting the project dir) and run it.
  workshop exec -w /home/workshop/app -- go build -o /tmp/spread-app .
  workshop exec -- test -x /tmp/spread-app

  # The program prints 16 UUIDs, one per line.
  workshop exec -- /tmp/spread-app | wc -l | MATCH "^\s*16$"

debug: |
  workshop exec -- ls -la /home/workshop/app /home/workshop/app/parallel || true
  workshop exec -- cat /home/workshop/app/go.mod /home/workshop/app/go.sum || true
  workshop exec -- cat /home/workshop/app/main.go || true
  workshop exec -- cat /home/workshop/app/parallel/parallel.go || true
  workshop exec -- go env || true
