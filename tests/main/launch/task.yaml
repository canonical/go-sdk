summary: Launch a workshop with the go SDK and verify setup

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  workshop exec -- go version | MATCH "go[0-9]+\.[0-9]+"
  workshop exec -- go env GOMODCACHE | MATCH "/home/workshop/go/pkg/mod"
  workshop exec -- go env GOTOOLCHAIN | MATCH "local"
  workshop exec -- which go
  workshop exec -- which gopls
  workshop exec -- gopls version
  workshop exec -- mkdir -p /tmp/gopls-smoke
  workshop exec -w /tmp/gopls-smoke -- go mod init example.com/gopls-smoke
  workshop exec -w /tmp/gopls-smoke -- sh -ec 'v=$(go env GOVERSION | sed -E "s/^go([0-9]+\.[0-9]+).*/\1/"); go mod edit -go="$v"'
  workshop exec -- cp /project/tests/main/launch/gopls-smoke/main.go /tmp/gopls-smoke/main.go
  workshop exec -w /tmp/gopls-smoke -- gopls check ./...

debug: |
  workshop exec -- printenv PATH || true
  workshop exec -- go env || true
  workshop exec -- gopls version || true
