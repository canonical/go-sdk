summary: setup-base configures GOMODCACHE and GOTOOLCHAIN for the workshop user

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # GOMODCACHE points at the bind-mounted `mod-cache` plug so module
  # downloads survive workshop updates. GOTOOLCHAIN=local stops `go`
  # from silently downloading a newer toolchain when a project's
  # `go.mod` declares a higher version than the one we shipped.
  workshop exec -- bash -lc 'go env GOMODCACHE' | MATCH "^/home/workshop/go/pkg/mod$"
  workshop exec -- bash -lc 'go env GOTOOLCHAIN' | MATCH "^local$"

debug: |
  workshop exec -- bash -lc 'go env' || true
